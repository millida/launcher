[package]
name = "millida-voice"
version = "0.1.0"
description = "Party voice client for the Millida voice relay"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
# Same AES-GCM crate the vault uses; the relay seals every datagram with AES-128-GCM.
aes-gcm = "0.10"
sha2 = "0.10"
# Pure Rust Opus (BSD-3-Clause): no C toolchain or cmake on the build machines.
opus-rs = "0.1"
cpal = "0.18"
# RNNoise ported to Rust (BSD-3-Clause), the same denoiser the mod runs.
nnnoiseless = { version = "0.5", default-features = false }
